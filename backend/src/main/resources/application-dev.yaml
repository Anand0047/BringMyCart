spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/bringmycart_dev
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

bmc:
  auth:
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
    allowed-cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,chrome-extension://mlogpmpajiokfmjnlmehmpgphbbflpem}
    extension-clients:
      bmc-chrome-dev: ${BMC_EXTENSION_DEV_CALLBACK_URI:https://mlogpmpajiokfmjnlmehmpgphbbflpem.chromiumapp.org/bmc-auth}
    extension-access-token-minutes: ${EXTENSION_ACCESS_TOKEN_MINUTES:8}
    extension-refresh-token-days: ${EXTENSION_REFRESH_TOKEN_DAYS:7}
