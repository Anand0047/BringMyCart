spring:
  application:
    name: bringmycart-backend
  profiles:
    default: dev

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.bringmycart.bmc: INFO

bmc:
  product-enrichment:
    core-pool-size: ${PRODUCT_ENRICHMENT_CORE_POOL_SIZE:1}
    max-pool-size: ${PRODUCT_ENRICHMENT_MAX_POOL_SIZE:2}
    queue-capacity: ${PRODUCT_ENRICHMENT_QUEUE_CAPACITY:10}
    max-attempts: ${PRODUCT_ENRICHMENT_MAX_ATTEMPTS:2}
    retry-delay: ${PRODUCT_ENRICHMENT_RETRY_DELAY:PT15M}
    manual-refresh-cooldown: ${PRODUCT_ENRICHMENT_MANUAL_REFRESH_COOLDOWN:PT5M}
    recovery-enabled: ${PRODUCT_ENRICHMENT_RECOVERY_ENABLED:false}
    recovery-interval: ${PRODUCT_ENRICHMENT_RECOVERY_INTERVAL:PT15M}
    stale-after: ${PRODUCT_ENRICHMENT_STALE_AFTER:PT30M}
    recovery-batch-size: ${PRODUCT_ENRICHMENT_RECOVERY_BATCH_SIZE:10}
  axesso:
    base-url: ${AXESSO_BASE_URL:https://axesso-axesso-amazon-data-service-v1.p.rapidapi.com}
    host: ${AXESSO_RAPIDAPI_HOST:axesso-axesso-amazon-data-service-v1.p.rapidapi.com}
    api-key: ${AXESSO_RAPIDAPI_KEY:}
    connect-timeout: ${AXESSO_CONNECT_TIMEOUT:5s}
    read-timeout: ${AXESSO_READ_TIMEOUT:30s}
    monthly-request-limit: ${AXESSO_MONTHLY_REQUEST_LIMIT:100}
  auth:
    issuer: ${JWT_ISSUER:bringmycart}
    audience: ${JWT_AUDIENCE:bringmycart-api}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}
    allowed-cors-origins: ${CORS_ALLOWED_ORIGINS:}
    rate-limit-max-attempts: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:5}
    rate-limit-window-minutes: ${AUTH_RATE_LIMIT_WINDOW_MINUTES:15}
